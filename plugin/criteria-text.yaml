criteria:
  - number: "1.1.1"
    name: "Non-text Content"
    text: |-
      All non-text content that is presented to the user has a text alternative that serves the equivalent purpose, except for the situations listed below.
      - Controls, Input: If non-text content is a control or accepts user input, then it has a name that describes its purpose. (Refer to Success Criterion 4.1.2 for additional requirements for controls and content that accepts user input.)
      - Time-Based Media: If non-text content is time-based media, then text alternatives at least provide descriptive identification of the non-text content. (Refer to Guideline 1.2 for additional requirements for media.)
      - Test: If non-text content is a test or exercise that would be invalid if presented in text, then text alternatives at least provide descriptive identification of the non-text content.
      - Sensory: If non-text content is primarily intended to create a specific sensory experience, then text alternatives at least provide descriptive identification of the non-text content.
      - CAPTCHA: If the purpose of non-text content is to confirm that content is being accessed by a person rather than a computer, then text alternatives that identify and describe the purpose of the non-text content are provided, and alternative forms of CAPTCHA using output modes for different types of sensory perception are provided to accommodate different disabilities.
      - Decoration, Formatting, Invisible: If non-text content is pure decoration, is used only for visual formatting, or is not presented to users, then it is implemented in a way that it can be ignored by assistive technology.
    definitions: ["dfn-assistive-technologies", "dfn-captcha", "dfn-name", "dfn-non-text-content", "dfn-pure-decoration", "dfn-specific-sensory-experience", "dfn-text", "dfn-text-alternative"]
  - number: "1.2.1"
    name: "Audio-only and Video-only (Prerecorded)"
    text: |-
      For prerecorded audio-only and prerecorded video-only media, the following are true, except when the audio or video is a media alternative for text and is clearly labeled as such:
      - Prerecorded Audio-only: An alternative for time-based media is provided that presents equivalent information for prerecorded audio-only content.
      - Prerecorded Video-only: Either an alternative for time-based media or an audio track is provided that presents equivalent information for prerecorded video-only content.
    definitions: ["dfn-alternative-for-time-based-media", "dfn-audio-only", "dfn-media-alternative-for-text", "dfn-prerecorded", "dfn-video-only"]
  - number: "1.2.2"
    name: "Captions (Prerecorded)"
    text: |-
      Captions are provided for all prerecorded audio content in synchronized media, except when the media is a media alternative for text and is clearly labeled as such.
    definitions: ["dfn-audio", "dfn-captions", "dfn-media-alternative-for-text", "dfn-prerecorded", "dfn-synchronized-media"]
  - number: "1.2.3"
    name: "Audio Description or Media Alternative (Prerecorded)"
    text: |-
      An alternative for time-based media or audio description of the prerecorded video content is provided for synchronized media, except when the media is a media alternative for text and is clearly labeled as such.
    definitions: ["dfn-alternative-for-time-based-media", "dfn-audio-descriptions", "dfn-media-alternative-for-text", "dfn-prerecorded", "dfn-synchronized-media", "dfn-video"]
  - number: "1.2.4"
    name: "Captions (Live)"
    text: |-
      Captions are provided for all live audio content in synchronized media.
    definitions: ["dfn-audio", "dfn-captions", "dfn-live", "dfn-synchronized-media"]
  - number: "1.2.5"
    name: "Audio Description (Prerecorded)"
    text: |-
      Audio description is provided for all prerecorded video content in synchronized media.
    definitions: ["dfn-audio-descriptions", "dfn-prerecorded", "dfn-synchronized-media", "dfn-video"]
  - number: "1.2.6"
    name: "Sign Language (Prerecorded)"
    text: |-
      Sign language interpretation is provided for all prerecorded audio content in synchronized media.
    definitions: ["dfn-audio", "dfn-prerecorded", "dfn-sign-language-interpretation", "dfn-synchronized-media"]
  - number: "1.2.7"
    name: "Extended Audio Description (Prerecorded)"
    text: |-
      Where pauses in foreground audio are insufficient to allow audio descriptions to convey the sense of the video, extended audio description is provided for all prerecorded video content in synchronized media.
    definitions: ["dfn-audio-descriptions", "dfn-extended-audio-description", "dfn-prerecorded", "dfn-synchronized-media", "dfn-video"]
  - number: "1.2.8"
    name: "Media Alternative (Prerecorded)"
    text: |-
      An alternative for time-based media is provided for all prerecorded synchronized media and for all prerecorded video-only media.
    definitions: ["dfn-alternative-for-time-based-media", "dfn-prerecorded", "dfn-synchronized-media", "dfn-video-only"]
  - number: "1.2.9"
    name: "Audio-only (Live)"
    text: |-
      An alternative for time-based media that presents equivalent information for live audio-only content is provided.
    definitions: ["dfn-alternative-for-time-based-media", "dfn-audio-only", "dfn-live"]
  - number: "1.3.1"
    name: "Info and Relationships"
    text: |-
      Information, structure, and relationships conveyed through presentation can be programmatically determined or are available in text.
    definitions: ["dfn-presentation", "dfn-programmatically-determinable", "dfn-relationships", "dfn-structure"]
  - number: "1.3.2"
    name: "Meaningful Sequence"
    text: |-
      When the sequence in which content is presented affects its meaning, a correct reading sequence can be programmatically determined.
    definitions: ["dfn-correct-reading-sequence", "dfn-programmatically-determinable"]
  - number: "1.3.3"
    name: "Sensory Characteristics"
    text: |-
      Instructions provided for understanding and operating content do not rely solely on sensory characteristics of components such as shape, color, size, visual location, orientation, or sound.
    notes:
      - |-
        For requirements related to color, refer to Guideline 1.4.
  - number: "1.3.4"
    name: "Orientation"
    text: |-
      Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless a specific display orientation is essential.
    notes:
      - |-
        Examples where a particular display orientation may be essential are a bank check, a piano application, slides for a projector or television, or virtual reality content where content is not necessarily restricted to landscape or portrait display orientation.
    definitions: ["dfn-essential"]
  - number: "1.3.5"
    name: "Identify Input Purpose"
    text: |-
      The purpose of each input field collecting information about the user can be programmatically determined when:
      - The input field serves a purpose identified in the Input Purposes for user interface components section; and
      - The content is implemented using technologies with support for identifying the expected meaning for form input data.
    definitions: ["dfn-programmatically-determinable"]
  - number: "1.3.6"
    name: "Identify Purpose"
    text: |-
      In content implemented using markup languages, the purpose of user interface components, icons, and regions can be programmatically determined.
    definitions: ["dfn-programmatically-determinable", "dfn-regions", "dfn-user-interface-components"]
  - number: "1.4.1"
    name: "Use of Color"
    text: |-
      Color is not used as the only visual means of conveying information, indicating an action, prompting a response, or distinguishing a visual element.
    notes:
      - |-
        This success criterion addresses color perception specifically. Other forms of perception are covered in Guideline 1.3 including programmatic access to color and other visual presentation coding.
  - number: "1.4.2"
    name: "Audio Control"
    text: |-
      If any audio on a web page plays automatically for more than 3 seconds, either a mechanism is available to pause or stop the audio, or a mechanism is available to control audio volume independently from the overall system volume level.
    notes:
      - |-
        Since any content that does not meet this success criterion can interfere with a user's ability to use the whole page, all content on the web page (whether or not it is used to meet other success criteria) must meet this success criterion. See Conformance Requirement 5: Non-Interference.
    definitions: ["dfn-mechanism", "dfn-pause"]
  - number: "1.4.3"
    name: "Contrast (Minimum)"
    text: |-
      The visual presentation of text and images of text has a contrast ratio of at least 4.5:1, except for the following:
      - Large Text: Large-scale text and images of large-scale text have a contrast ratio of at least 3:1;
      - Incidental: Text or images of text that are part of an inactive user interface component, that are pure decoration, that are not visible to anyone, or that are part of a picture that contains significant other visual content, have no contrast requirement.
      - Logotypes: Text that is part of a logo or brand name has no contrast requirement.
    definitions: ["dfn-contrast-ratio", "dfn-images-of-text", "dfn-large-scale", "dfn-pure-decoration", "dfn-text", "dfn-user-interface-components"]
  - number: "1.4.4"
    name: "Resize Text"
    text: |-
      Except for captions and images of text, text can be resized without assistive technology up to 200 percent without loss of content or functionality.
    definitions: ["dfn-assistive-technologies", "dfn-captions", "dfn-images-of-text", "dfn-text"]
  - number: "1.4.5"
    name: "Images of Text"
    text: |-
      If the technologies being used can achieve the visual presentation, text is used to convey information rather than images of text except for the following:
      - Customizable: The image of text can be visually customized to the user's requirements;
      - Essential: A particular presentation of text is essential to the information being conveyed.
    notes:
      - |-
        Logotypes (text that is part of a logo or brand name) are considered essential.
    definitions: ["dfn-essential", "dfn-images-of-text", "dfn-text", "dfn-visually-customized"]
  - number: "1.4.6"
    name: "Contrast (Enhanced)"
    text: |-
      The visual presentation of text and images of text has a contrast ratio of at least 7:1, except for the following:
      - Large Text: Large-scale text and images of large-scale text have a contrast ratio of at least 4.5:1;
      - Incidental: Text or images of text that are part of an inactive user interface component, that are pure decoration, that are not visible to anyone, or that are part of a picture that contains significant other visual content, have no contrast requirement.
      - Logotypes: Text that is part of a logo or brand name has no contrast requirement.
    definitions: ["dfn-contrast-ratio", "dfn-images-of-text", "dfn-large-scale", "dfn-pure-decoration", "dfn-text", "dfn-user-interface-components"]
  - number: "1.4.7"
    name: "Low or No Background Audio"
    text: |-
      For prerecorded audio-only content that (1) contains primarily speech in the foreground, (2) is not an audio CAPTCHA or audio logo, and (3) is not vocalization intended to be primarily musical expression such as singing or rapping, at least one of the following is true:
      - No Background: The audio does not contain background sounds.
      - Turn Off: The background sounds can be turned off.
      - 20 dB: The background sounds are at least 20 decibels lower than the foreground speech content, with the exception of occasional sounds that last for only one or two seconds. NotePer the definition of "decibel," background sound that meets this requirement will be approximately four times quieter than the foreground speech content.
    definitions: ["dfn-audio-only", "dfn-captcha", "dfn-prerecorded"]
  - number: "1.4.8"
    name: "Visual Presentation"
    text: |-
      For the visual presentation of blocks of text, a mechanism is available to achieve the following:
      - Foreground and background colors can be selected by the user.
      - Width is no more than 80 characters or glyphs (40 if CJK).
      - Text is not justified (aligned to both the left and the right margins).
      - Line spacing (leading) is at least space-and-a-half within paragraphs, and paragraph spacing is at least 1.5 times larger than the line spacing.
      - Text can be resized without assistive technology up to 200 percent in a way that does not require the user to scroll horizontally to read a line of text on a full-screen window.
    notes:
      - |-
        Content is not required to use these values. The requirement is that a mechanism is available for users to change these presentation aspects. The mechanism can be provided by the browser or other user agent. Content is not required to provide the mechanism.
      - |-
        Writing systems for some languages use different presentation aspects to improve readability and legibility. If a presentation aspect in this success criterion is not used in a writing system, content in that writing system does not need to use that presentation setting and can conform without it. Authors are encouraged to follow guidance for improving readability and legibility of text in their writing system.
    definitions: ["dfn-assistive-technologies", "dfn-blocks-of-text", "dfn-mechanism", "dfn-on-a-full-screen-window"]
  - number: "1.4.9"
    name: "Images of Text (No Exception)"
    text: |-
      Images of text are only used for pure decoration or where a particular presentation of text is essential to the information being conveyed.
    notes:
      - |-
        Logotypes (text that is part of a logo or brand name) are considered essential.
    definitions: ["dfn-essential", "dfn-images-of-text", "dfn-pure-decoration", "dfn-text"]
  - number: "1.4.10"
    name: "Reflow"
    text: |-
      Content can be presented without loss of information or functionality, and without requiring scrolling in two dimensions for:
      - Vertical scrolling content at a width equivalent to 320 CSS pixels;
      - Horizontal scrolling content at a height equivalent to 256 CSS pixels.
      Except for parts of the content which require two-dimensional layout for usage or meaning.
    notes:
      - |-
        320 CSS pixels is equivalent to a starting viewport width of 1280 CSS pixels wide at 400% zoom. For web content which is designed to scroll horizontally (e.g., with vertical text), 256 CSS pixels is equivalent to a starting viewport height of 1024 CSS pixels at 400% zoom.
      - |-
        Examples of content which requires two-dimensional layout are images required for understanding (such as maps and diagrams), video, games, presentations, data tables (not individual cells), and interfaces where it is necessary to keep toolbars in view while manipulating content. It is acceptable to provide two-dimensional scrolling for such parts of the content.
    definitions: ["dfn-css-pixels", "dfn-viewport"]
  - number: "1.4.11"
    name: "Non-text Contrast"
    text: |-
      The visual presentation of the following have a contrast ratio of at least 3:1 against adjacent color(s):
      - User Interface Components: Visual information required to identify user interface components and states, except for inactive components or where the appearance of the component is determined by the user agent and not modified by the author;
      - Graphical Objects: Parts of graphics required to understand the content, except when a particular presentation of graphics is essential to the information being conveyed.
    definitions: ["dfn-contrast-ratio", "dfn-essential", "dfn-presentation", "dfn-states", "dfn-user-agents", "dfn-user-interface-components"]
  - number: "1.4.12"
    name: "Text Spacing"
    text: |-
      In content implemented using markup languages that support the following text style properties, no loss of content or functionality occurs by setting all of the following and by changing no other style property:
      - Line height (line spacing) to at least 1.5 times the font size;
      - Spacing following paragraphs to at least 2 times the font size;
      - Letter spacing (tracking) to at least 0.12 times the font size;
      - Word spacing to at least 0.16 times the font size.
      Exception: Human languages and scripts that do not make use of one or more of these text style properties in written text can conform using only the properties that exist for that combination of language and script.
    notes:
      - |-
        Content is not required to use these text spacing values. The requirement is to ensure that when a user overrides the authored text spacing, content or functionality is not lost.
      - |-
        Writing systems for some languages use different text spacing settings, such as paragraph start indent. Authors are encouraged to follow locally available guidance for improving readability and legibility of text in their writing system.
    definitions: ["dfn-human-language-s", "dfn-style-properties", "dfn-text"]
  - number: "1.4.13"
    name: "Content on Hover or Focus"
    text: |-
      Where receiving and then removing pointer hover or keyboard focus triggers additional content to become visible and then hidden, the following are true:
      - Dismissible: A mechanism is available to dismiss the additional content without moving pointer hover or keyboard focus, unless the additional content communicates an input error or does not obscure or replace other content;
      - Hoverable: If pointer hover can trigger the additional content, then the pointer can be moved over the additional content without the additional content disappearing;
      - Persistent: The additional content remains visible until the hover or focus trigger is removed, the user dismisses it, or its information is no longer valid.
      Exception: The visual presentation of the additional content is controlled by the user agent and is not modified by the author.
    notes:
      - |-
        Examples of additional content controlled by the user agent include browser tooltips created through use of the HTML title attribute [HTML].
      - |-
        Custom tooltips, sub-menus, and other nonmodal popups that display on hover and focus are examples of additional content covered by this criterion.
      - |-
        This criterion applies to content that appears in addition to the triggering component itself. Since hidden components that are made visible on keyboard focus (such as links used to skip to another part of a page) do not present additional content they are not covered by this criterion.
    definitions: ["dfn-input-error", "dfn-mechanism", "dfn-user-agents"]
  - number: "2.1.1"
    name: "Keyboard"
    text: |-
      All functionality of the content is operable through a keyboard interface without requiring specific timings for individual keystrokes, except where the underlying function requires input that depends on the path of the user's movement and not just the endpoints.
    notes:
      - |-
        This exception relates to the underlying function, not the input technique. For example, if using handwriting to enter text, the input technique (handwriting) requires path-dependent input but the underlying function (text input) does not.
      - |-
        This does not forbid and should not discourage providing mouse input or other input methods in addition to keyboard operation.
    definitions: ["dfn-functionality", "dfn-keyboard-interface"]
  - number: "2.1.2"
    name: "No Keyboard Trap"
    text: |-
      If keyboard focus can be moved to a component of the page using a keyboard interface, then focus can be moved away from that component using only a keyboard interface, and, if it requires more than unmodified arrow or tab keys or other standard exit methods, the user is advised of the method for moving focus away.
    notes:
      - |-
        Since any content that does not meet this success criterion can interfere with a user's ability to use the whole page, all content on the web page (whether it is used to meet other success criteria or not) must meet this success criterion. See Conformance Requirement 5: Non-Interference.
    definitions: ["dfn-keyboard-interface"]
  - number: "2.1.3"
    name: "Keyboard (No Exception)"
    text: |-
      All functionality of the content is operable through a keyboard interface without requiring specific timings for individual keystrokes.
    definitions: ["dfn-functionality", "dfn-keyboard-interface"]
  - number: "2.1.4"
    name: "Character Key Shortcuts"
    text: |-
      If a keyboard shortcut is implemented in content using only letter (including upper- and lower-case letters), punctuation, number, or symbol characters, then at least one of the following is true:
      - Turn off: A mechanism is available to turn the shortcut off;
      - Remap: A mechanism is available to remap the shortcut to include one or more non-printable keyboard keys (e.g., Ctrl, Alt);
      - Active only on focus: The keyboard shortcut for a user interface component is only active when that component has focus.
    definitions: ["dfn-keyboard-shortcuts", "dfn-mechanism", "dfn-user-interface-components"]
  - number: "2.2.1"
    name: "Timing Adjustable"
    text: |-
      For each time limit that is set by the content, at least one of the following is true:
      - Turn off: The user is allowed to turn off the time limit before encountering it; or
      - Adjust: The user is allowed to adjust the time limit before encountering it over a wide range that is at least ten times the length of the default setting; or
      - Extend: The user is warned before time expires and given at least 20 seconds to extend the time limit with a simple action (for example, "press the space bar"), and the user is allowed to extend the time limit at least ten times; or
      - Real-time Exception: The time limit is a required part of a real-time event (for example, an auction), and no alternative to the time limit is possible; or
      - Essential Exception: The time limit is essential and extending it would invalidate the activity; or
      - 20 Hour Exception: The time limit is longer than 20 hours.
    notes:
      - |-
        This success criterion helps ensure that users can complete tasks without unexpected changes in content or context that are a result of a time limit. This success criterion should be considered in conjunction with Success Criterion 3.2.1, which puts limits on changes of content or context as a result of user action.
    definitions: ["dfn-essential", "dfn-real-time-events"]
  - number: "2.2.2"
    name: "Pause, Stop, Hide"
    text: |-
      For moving, blinking, scrolling, or auto-updating information, all of the following are true:
      - Moving, blinking, scrolling: For any moving, blinking or scrolling information that (1) starts automatically, (2) lasts more than five seconds, and (3) is presented in parallel with other content, there is a mechanism for the user to pause, stop, or hide it unless the movement, blinking, or scrolling is part of an activity where it is essential; and
      - Auto-updating: For any auto-updating information that (1) starts automatically and (2) is presented in parallel with other content, there is a mechanism for the user to pause, stop, or hide it or to control the frequency of the update unless the auto-updating is part of an activity where it is essential.
    notes:
      - |-
        For requirements related to flickering or flashing content, refer to Guideline 2.3.
      - |-
        Since any content that does not meet this success criterion can interfere with a user's ability to use the whole page, all content on the web page (whether it is used to meet other success criteria or not) must meet this success criterion. See Conformance Requirement 5: Non-Interference.
      - |-
        Content that is updated periodically by software or that is streamed to the user agent is not required to preserve or present information that is generated or received between the initiation of the pause and resuming presentation, as this may not be technically possible, and in many situations could be misleading to do so.
      - |-
        An animation that occurs as part of a preload phase or similar situation can be considered essential if interaction cannot occur during that phase for all users and if not indicating progress could confuse users or cause them to think that content was frozen or broken.
    definitions: ["dfn-blinking", "dfn-essential", "dfn-mechanism", "dfn-pause"]
  - number: "2.2.3"
    name: "No Timing"
    text: |-
      Timing is not an essential part of the event or activity presented by the content, except for non-interactive synchronized media and real-time events.
    definitions: ["dfn-essential", "dfn-real-time-events", "dfn-synchronized-media"]
  - number: "2.2.4"
    name: "Interruptions"
    text: |-
      Interruptions can be postponed or suppressed by the user, except interruptions involving an emergency.
    definitions: ["dfn-emergency"]
  - number: "2.2.5"
    name: "Re-authenticating"
    text: |-
      When an authenticated session expires, the user can continue the activity without loss of data after re-authenticating.
  - number: "2.2.6"
    name: "Timeouts"
    text: |-
      Users are warned of the duration of any user inactivity that could cause data loss, unless the data is preserved for more than 20 hours when the user does not take any actions.
    notes:
      - |-
        Privacy regulations may require explicit user consent before user identification has been authenticated and before user data is preserved. In cases where the user is a minor, explicit consent may not be solicited in most jurisdictions, countries or regions. Consultation with privacy professionals and legal counsel is advised when considering data preservation as an approach to satisfy this success criterion.
    definitions: ["dfn-user-inactivity"]
  - number: "2.3.1"
    name: "Three Flashes or Below Threshold"
    text: |-
      Web pages do not contain anything that flashes more than three times in any one second period, or the flash is below the general flash and red flash thresholds.
    notes:
      - |-
        Since any content that does not meet this success criterion can interfere with a user's ability to use the whole page, all content on the web page (whether it is used to meet other success criteria or not) must meet this success criterion. See Conformance Requirement 5: Non-Interference.
    definitions: ["dfn-flashes", "dfn-general-flash-and-red-flash-thresholds", "dfn-web-page-s"]
  - number: "2.3.2"
    name: "Three Flashes"
    text: |-
      Web pages do not contain anything that flashes more than three times in any one second period.
    definitions: ["dfn-flashes", "dfn-web-page-s"]
  - number: "2.3.3"
    name: "Animation from Interactions"
    text: |-
      Motion animation triggered by interaction can be disabled, unless the animation is essential to the functionality or the information being conveyed.
    definitions: ["dfn-essential", "dfn-motion-animation"]
  - number: "2.4.1"
    name: "Bypass Blocks"
    text: |-
      A mechanism is available to bypass blocks of content that are repeated on multiple web pages.
    definitions: ["dfn-mechanism", "dfn-web-page-s"]
  - number: "2.4.2"
    name: "Page Titled"
    text: |-
      Web pages have titles that describe topic or purpose.
    definitions: ["dfn-web-page-s"]
  - number: "2.4.3"
    name: "Focus Order"
    text: |-
      If a web page can be navigated sequentially and the navigation sequences affect meaning or operation, focusable components receive focus in an order that preserves meaning and operability.
    definitions: ["dfn-navigated-sequentially", "dfn-web-page-s"]
  - number: "2.4.4"
    name: "Link Purpose (In Context)"
    text: |-
      The purpose of each link can be determined from the link text alone or from the link text together with its programmatically determined link context, except where the purpose of the link would be ambiguous to users in general.
    definitions: ["dfn-ambiguous-to-users-in-general", "dfn-programmatically-determined-link-context", "dfn-purpose-of-each-link"]
  - number: "2.4.5"
    name: "Multiple Ways"
    text: |-
      More than one way is available to locate a web page within a set of web pages except where the web page is the result of, or a step in, a process.
    definitions: ["dfn-processes", "dfn-set-of-web-pages", "dfn-web-page-s"]
  - number: "2.4.6"
    name: "Headings and Labels"
    text: |-
      Headings and labels describe topic or purpose.
    definitions: ["dfn-labels"]
  - number: "2.4.7"
    name: "Focus Visible"
    text: |-
      Any keyboard operable user interface has a mode of operation where the keyboard focus indicator is visible.
    definitions: ["dfn-focus-indicator"]
  - number: "2.4.8"
    name: "Location"
    text: |-
      Information about the user's location within a set of web pages is available.
    definitions: ["dfn-set-of-web-pages"]
  - number: "2.4.9"
    name: "Link Purpose (Link Only)"
    text: |-
      A mechanism is available to allow the purpose of each link to be identified from link text alone, except where the purpose of the link would be ambiguous to users in general.
    definitions: ["dfn-ambiguous-to-users-in-general", "dfn-mechanism", "dfn-purpose-of-each-link"]
  - number: "2.4.10"
    name: "Section Headings"
    text: |-
      Section headings are used to organize the content.
    notes:
      - |-
        "Heading" is used in its general sense and includes titles and other ways to add a heading to different types of content.
      - |-
        This success criterion covers sections within writing, not user interface components. User interface components are covered under Success Criterion 4.1.2.
    definitions: ["dfn-section", "dfn-user-interface-components"]
  - number: "2.4.11"
    name: "Focus Not Obscured (Minimum)"
    text: |-
      When a user interface component receives keyboard focus, the component is not entirely hidden due to author-created content.
    notes:
      - |-
        Where content in a configurable interface can be repositioned by the user, then only the initial positions of user-movable content are considered for testing and conformance of this success criterion.
      - |-
        Content opened by the user may obscure the component receiving focus. If the user can reveal the focused component without advancing the keyboard focus, the component with focus is not considered visually hidden due to author-created content.
    definitions: ["dfn-user-interface-components"]
  - number: "2.4.12"
    name: "Focus Not Obscured (Enhanced)"
    text: |-
      When a user interface component receives keyboard focus, no part of the component is hidden by author-created content.
    definitions: ["dfn-user-interface-components"]
  - number: "2.4.13"
    name: "Focus Appearance"
    text: |-
      When the keyboard focus indicator is visible, an area of the focus indicator meets all the following:
      - is at least as large as the area of a 2 CSS pixel thick perimeter of the unfocused component or sub-component, and
      - has a contrast ratio of at least 3:1 between the same pixels in the focused and unfocused states.
      Exceptions:
      - The focus indicator is determined by the user agent and cannot be adjusted by the author, or
      - The focus indicator and the indicator's background color are not modified by the author.
    notes:
      - |-
        What is perceived as the user interface component or sub-component (to determine the perimeter) depends on its visual presentation. The visual presentation includes the component's visible content, border, and component-specific background. It does not include shadow and glow effects outside the component's content, background, or border.
      - |-
        Examples of sub-components that may receive a focus indicator are menu items in an opened drop-down menu, or focusable cells in a grid.
      - |-
        Contrast calculations can be based on colors defined within the technology (such as HTML, CSS, and SVG). Pixels modified by user agent resolution enhancements and anti-aliasing can be ignored.
    definitions: ["dfn-content", "dfn-css-pixels", "dfn-focus-indicator", "dfn-perimeter", "dfn-presentation", "dfn-technologies", "dfn-user-agents"]
  - number: "2.5.1"
    name: "Pointer Gestures"
    text: |-
      All functionality that uses multipoint or path-based gestures for operation can be operated with a single pointer without a path-based gesture, unless a multipoint or path-based gesture is essential.
    notes:
      - |-
        This requirement applies to web content that interprets pointer actions (i.e., this does not apply to actions that are required to operate the user agent or assistive technology).
    definitions: ["dfn-essential", "dfn-functionality", "dfn-single-pointer"]
  - number: "2.5.2"
    name: "Pointer Cancellation"
    text: |-
      For functionality that can be operated using a single pointer, at least one of the following is true:
      - No Down-Event: The down-event of the pointer is not used to execute any part of the function;
      - Abort or Undo: Completion of the function is on the up-event, and a mechanism is available to abort the function before completion or to undo the function after completion;
      - Up Reversal: The up-event reverses any outcome of the preceding down-event;
      - Essential: Completing the function on the down-event is essential.
    notes:
      - |-
        Functions that emulate a keyboard or numeric keypad key press are considered essential.
      - |-
        This requirement applies to web content that interprets pointer actions (i.e., this does not apply to actions that are required to operate the user agent or assistive technology).
    definitions: ["dfn-down-event", "dfn-essential", "dfn-functionality", "dfn-mechanism", "dfn-single-pointer", "dfn-up-event"]
  - number: "2.5.3"
    name: "Label in Name"
    text: |-
      For user interface components with labels that include text or images of text, the name contains the text that is presented visually.
    notes:
      - |-
        A best practice is to have the text of the label at the start of the name.
    definitions: ["dfn-images-of-text", "dfn-labels", "dfn-name", "dfn-text", "dfn-user-interface-components"]
  - number: "2.5.4"
    name: "Motion Actuation"
    text: |-
      Functionality that can be operated by device motion or user motion can also be operated by user interface components and responding to the motion can be disabled to prevent accidental actuation, except when:
      - Supported Interface: The motion is used to operate functionality through an accessibility supported interface;
      - Essential: The motion is essential for the function and doing so would invalidate the activity.
    definitions: ["dfn-accessibility-supported", "dfn-essential", "dfn-functionality", "dfn-user-interface-components"]
  - number: "2.5.5"
    name: "Target Size (Enhanced)"
    text: |-
      The size of the target for pointer inputs is at least 44 by 44 CSS pixels except when:
      - Equivalent: The target is available through an equivalent link or control on the same page that is at least 44 by 44 CSS pixels;
      - Inline: The target is in a sentence or block of text;
      - User Agent Control: The size of the target is determined by the user agent and is not modified by the author;
      - Essential: A particular presentation of the target is essential to the information being conveyed.
    definitions: ["dfn-blocks-of-text", "dfn-css-pixels", "dfn-essential", "dfn-pointer-inputs", "dfn-presentation", "dfn-targets", "dfn-user-agents"]
  - number: "2.5.6"
    name: "Concurrent Input Mechanisms"
    text: |-
      Web content does not restrict use of input modalities available on a platform except where the restriction is essential, required to ensure the security of the content, or required to respect user settings.
    definitions: ["dfn-essential"]
  - number: "2.5.7"
    name: "Dragging Movements"
    text: |-
      All functionality that uses a dragging movement for operation can be achieved by a single pointer without dragging, unless dragging is essential or the functionality is determined by the user agent and not modified by the author.
    notes:
      - |-
        This requirement applies to web content that interprets pointer actions (i.e., this does not apply to actions that are required to operate the user agent or assistive technology).
    definitions: ["dfn-dragging-movements", "dfn-essential", "dfn-functionality", "dfn-single-pointer", "dfn-user-agents"]
  - number: "2.5.8"
    name: "Target Size (Minimum)"
    text: |-
      The size of the target for pointer inputs is at least 24 by 24 CSS pixels, except when:
      - Spacing: Undersized targets (those less than 24 by 24 CSS pixels) are positioned so that if a 24 CSS pixel diameter circle is centered on the bounding box of each, the circles do not intersect another target or the circle for another undersized target;
      - Equivalent: The function can be achieved through a different control on the same page that meets this criterion;
      - Inline: The target is in a sentence or its size is otherwise constrained by the line-height of non-target text;
      - User Agent Control: The size of the target is determined by the user agent and is not modified by the author;
      - Essential: A particular presentation of the target is essential or is legally required for the information being conveyed.
    notes:
      - |-
        Targets that allow for values to be selected spatially based on position within the target are considered one target for the purpose of the success criterion. Examples include sliders, color pickers displaying a gradient of colors, or editable areas where you position the cursor.
      - |-
        For inline targets the line-height should be interpreted as perpendicular to the flow of text. For example, in a language displayed vertically, the line-height would be horizontal.
    definitions: ["dfn-bounding-boxes", "dfn-css-pixels", "dfn-essential", "dfn-pointer-inputs", "dfn-presentation", "dfn-targets", "dfn-user-agents"]
  - number: "3.1.1"
    name: "Language of Page"
    text: |-
      The default human language of each web page can be programmatically determined.
    definitions: ["dfn-human-language-s", "dfn-programmatically-determinable", "dfn-web-page-s"]
  - number: "3.1.2"
    name: "Language of Parts"
    text: |-
      The human language of each passage or phrase in the content can be programmatically determined except for proper names, technical terms, words of indeterminate language, and words or phrases that have become part of the vernacular of the immediately surrounding text.
    definitions: ["dfn-human-language-s", "dfn-programmatically-determinable", "dfn-text"]
  - number: "3.1.3"
    name: "Unusual Words"
    text: |-
      A mechanism is available for identifying specific definitions of words or phrases used in an unusual or restricted way, including idioms and jargon.
    definitions: ["dfn-idioms", "dfn-jargon", "dfn-mechanism", "dfn-used-in-an-unusual-or-restricted-way"]
  - number: "3.1.4"
    name: "Abbreviations"
    text: |-
      A mechanism for identifying the expanded form or meaning of abbreviations is available.
    definitions: ["dfn-abbreviations", "dfn-mechanism"]
  - number: "3.1.5"
    name: "Reading Level"
    text: |-
      When text requires reading ability more advanced than the lower secondary education level after removal of proper names and titles, supplemental content, or a version that does not require reading ability more advanced than the lower secondary education level, is available.
    definitions: ["dfn-lower-secondary-education-level", "dfn-supplementary-content"]
  - number: "3.1.6"
    name: "Pronunciation"
    text: |-
      A mechanism is available for identifying specific pronunciation of words where meaning of the words, in context, is ambiguous without knowing the pronunciation.
    definitions: ["dfn-mechanism"]
  - number: "3.2.1"
    name: "On Focus"
    text: |-
      When any user interface component receives focus, it does not initiate a change of context.
    definitions: ["dfn-change-of-context", "dfn-user-interface-components"]
  - number: "3.2.2"
    name: "On Input"
    text: |-
      Changing the setting of any user interface component does not automatically cause a change of context unless the user has been advised of the behavior before using the component.
    definitions: ["dfn-change-of-context", "dfn-user-interface-components"]
  - number: "3.2.3"
    name: "Consistent Navigation"
    text: |-
      Navigational mechanisms that are repeated on multiple web pages within a set of web pages occur in the same relative order each time they are repeated, unless a change is initiated by the user.
    definitions: ["dfn-same-relative-order", "dfn-set-of-web-pages", "dfn-web-page-s"]
  - number: "3.2.4"
    name: "Consistent Identification"
    text: |-
      Components that have the same functionality within a set of web pages are identified consistently.
    definitions: ["dfn-same-functionality", "dfn-set-of-web-pages"]
  - number: "3.2.5"
    name: "Change on Request"
    text: |-
      Changes of context are initiated only by user request or a mechanism is available to turn off such changes.
    definitions: ["dfn-change-of-context", "dfn-mechanism"]
  - number: "3.2.6"
    name: "Consistent Help"
    text: |-
      If a web page contains any of the following help mechanisms, and those mechanisms are repeated on multiple web pages within a set of web pages, they occur in the same order relative to other page content, unless a change is initiated by the user:
      - Human contact details;
      - Human contact mechanism;
      - Self-help option;
      - A fully automated contact mechanism.
    notes:
      - |-
        Help mechanisms may be provided directly on the page, or may be provided via a direct link to a different page containing the information.
      - |-
        For this success criterion, "the same order relative to other page content" can be thought of as how the content is ordered when the page is serialized. The visual position of a help mechanism is likely to be consistent across pages for the same page variation (e.g., CSS break-point). The user can initiate a change, such as changing the page's zoom or orientation, which may trigger a different page variation. This criterion is concerned with relative order across pages displayed in the same page variation (e.g., same zoom level and orientation).
    definitions: ["dfn-mechanism", "dfn-set-of-web-pages", "dfn-web-page-s"]
  - number: "3.3.1"
    name: "Error Identification"
    text: |-
      If an input error is automatically detected, the item that is in error is identified and the error is described to the user in text.
    definitions: ["dfn-input-error"]
  - number: "3.3.2"
    name: "Labels or Instructions"
    text: |-
      Labels or instructions are provided when content requires user input.
    definitions: ["dfn-labels"]
  - number: "3.3.3"
    name: "Error Suggestion"
    text: |-
      If an input error is automatically detected and suggestions for correction are known, then the suggestions are provided to the user, unless it would jeopardize the security or purpose of the content.
    definitions: ["dfn-input-error"]
  - number: "3.3.4"
    name: "Error Prevention (Legal, Financial, Data)"
    text: |-
      For web pages that cause legal commitments or financial transactions for the user to occur, that modify or delete user-controllable data in data storage systems, or that submit user test responses, at least one of the following is true:
      - Reversible: Submissions are reversible.
      - Checked: Data entered by the user is checked for input errors and the user is provided an opportunity to correct them.
      - Confirmed: A mechanism is available for reviewing, confirming, and correcting information before finalizing the submission.
    definitions: ["dfn-input-error", "dfn-legal-commitments", "dfn-mechanism", "dfn-user-controllable", "dfn-web-page-s"]
  - number: "3.3.5"
    name: "Help"
    text: |-
      Context-sensitive help is available.
    definitions: ["dfn-context-sensitive-help"]
  - number: "3.3.6"
    name: "Error Prevention (All)"
    text: |-
      For web pages that require the user to submit information, at least one of the following is true:
      - Reversible: Submissions are reversible.
      - Checked: Data entered by the user is checked for input errors and the user is provided an opportunity to correct them.
      - Confirmed: A mechanism is available for reviewing, confirming, and correcting information before finalizing the submission.
    definitions: ["dfn-input-error", "dfn-mechanism", "dfn-web-page-s"]
  - number: "3.3.7"
    name: "Redundant Entry"
    text: |-
      Information previously entered by or provided to the user that is required to be entered again in the same process is either:
      - auto-populated, or
      - available for the user to select.
      Except when:
      - re-entering the information is essential,
      - the information is required to ensure the security of the content, or
      - previously entered information is no longer valid.
    definitions: ["dfn-essential", "dfn-processes"]
  - number: "3.3.8"
    name: "Accessible Authentication (Minimum)"
    text: |-
      A cognitive function test (such as remembering a password or solving a puzzle) is not required for any step in an authentication process unless that step provides at least one of the following:
      - Alternative: Another authentication method that does not rely on a cognitive function test.
      - Mechanism: A mechanism is available to assist the user in completing the cognitive function test.
      - Object Recognition: The cognitive function test is to recognize objects.
      - Personal Content: The cognitive function test is to identify non-text content the user provided to the website.
    notes:
      - |-
        "Object recognition" and "Personal content" may be represented by images, video, or audio.
      - |-
        Examples of mechanisms that satisfy this criterion include: support for password entry by password managers to reduce memory need, and copy and paste to reduce the cognitive burden of re-typing.
    definitions: ["dfn-cognitive-function-test", "dfn-mechanism", "dfn-non-text-content", "dfn-processes"]
  - number: "3.3.9"
    name: "Accessible Authentication (Enhanced)"
    text: |-
      A cognitive function test (such as remembering a password or solving a puzzle) is not required for any step in an authentication process unless that step provides at least one of the following:
      - Alternative: Another authentication method that does not rely on a cognitive function test.
      - Mechanism: A mechanism is available to assist the user in completing the cognitive function test.
    definitions: ["dfn-cognitive-function-test", "dfn-mechanism", "dfn-processes"]
  - number: "4.1.1"
    name: "Parsing"
    text: ""
    notes:
      - |-
        This criterion was originally adopted to address problems that assistive technology had directly parsing HTML. Assistive technology no longer has any need to directly parse HTML. Consequently, these problems either no longer exist or are addressed by other criteria. This criterion no longer has utility and is removed.
  - number: "4.1.2"
    name: "Name, Role, Value"
    text: |-
      For all user interface components (including but not limited to: form elements, links and components generated by scripts), the name and role can be programmatically determined; states, properties, and values that can be set by the user can be programmatically set; and notification of changes to these items is available to user agents, including assistive technologies.
    notes:
      - |-
        This success criterion is primarily for web authors who develop or script their own user interface components. For example, standard HTML controls already meet this success criterion when used according to specification.
    definitions: ["dfn-assistive-technologies", "dfn-name", "dfn-programmatically-determinable", "dfn-programmatically-set", "dfn-role", "dfn-states", "dfn-user-agents", "dfn-user-interface-components"]
  - number: "4.1.3"
    name: "Status Messages"
    text: |-
      In content implemented using markup languages, status messages can be programmatically determined through role or properties such that they can be presented to the user by assistive technologies without receiving focus.
    definitions: ["dfn-assistive-technologies", "dfn-programmatically-determinable", "dfn-role", "dfn-status-messages"]

definitions:
  dfn-abbreviations:
    term: "abbreviation"
    text: |-
      shortened form of a word, phrase, or name where the abbreviation has not become part of the language
      Note: This includes initialisms and acronyms where:
      - initialisms are shortened forms of a name or phrase made from the initial letters of words or syllables contained in that name or phrase Not defined in all languages. Example 1SNCF is a French initialism that contains the initial letters of the Société Nationale des Chemins de Fer, the French national railroad. Example 2ESP is an initialism for extrasensory perception.
      - acronyms are abbreviated forms made from the initial letters or parts of other words (in a name or phrase) which may be pronounced as a word Example 3NOAA is an acronym made from the initial letters of the National Oceanic and Atmospheric Administration in the United States.
      Note: Some companies have adopted what used to be an initialism as their company name. In these cases, the new name of the company is the letters (for example, Ecma) and the word is no longer considered an abbreviation.
  dfn-accessibility-supported:
    term: "accessibility supported"
    text: |-
      supported by users' assistive technologies as well as the accessibility features in browsers and other user agents
      To qualify as an accessibility-supported use of a web content technology (or feature of a technology), both 1 and 2 must be satisfied for a web content technology (or feature):
      - The way that the web content technology is used must be supported by users' assistive technology (AT). This means that the way that the technology is used has been tested for interoperability with users' assistive technology in the human language(s) of the content, AND
      - The web content technology must have accessibility-supported user agents that are available to users. This means that at least one of the following four statements is true: The technology is supported natively in widely-distributed user agents that are also accessibility supported (such as HTML and CSS); OR The technology is supported in a widely-distributed plug-in that is also accessibility supported; OR The content is available in a closed environment, such as a university or corporate network, where the user agent required by the technology and used by the organization is also accessibility supported; OR The user agent(s) that support the technology are accessibility supported and are available for download or purchase in a way that: does not cost a person with a disability any more than a person without a disability and is as easy to find and obtain for a person with a disability as it is for a person without disabilities.
      Note: The Accessibility Guidelines Working Group and the W3C do not specify which or how much support by assistive technologies there must be for a particular use of a web technology in order for it to be classified as accessibility supported. (See Level of Assistive Technology Support Needed for "Accessibility Support".)
      Note: Web technologies can be used in ways that are not accessibility supported as long as they are not relied upon and the page as a whole meets the conformance requirements, including Conformance Requirement 4 and Conformance Requirement 5.
      Note: When a web technology is used in a way that is "accessibility supported," it does not imply that the entire technology or all uses of the technology are supported. Most technologies, including HTML, lack support for at least one feature or use. Pages conform to WCAG only if the uses of the technology that are accessibility supported can be relied upon to meet WCAG requirements.
      Note: When citing web content technologies that have multiple versions, the version(s) supported should be specified.
      Note: One way for authors to locate uses of a technology that are accessibility supported would be to consult compilations of uses that are documented to be accessibility supported. (See Understanding Accessibility-Supported Web Technology Uses.) Authors, companies, technology vendors, or others may document accessibility-supported ways of using web content technologies. However, all ways of using technologies in the documentation would need to meet the definition of accessibility-supported Web content technologies above.
  dfn-alternative-for-time-based-media:
    term: "alternative for time-based media"
    text: |-
      document including correctly sequenced text descriptions of time-based visual and auditory information and providing a means for achieving the outcomes of any time-based interaction
      Note: A screenplay used to create the synchronized media content would meet this definition only if it was corrected to accurately represent the final synchronized media after editing.
  dfn-ambiguous-to-users-in-general:
    term: "ambiguous to users in general"
    text: |-
      the purpose cannot be determined from the link and all information of the web page presented to the user simultaneously with the link (i.e., readers without disabilities would not know what a link would do until they activated it)
  dfn-assistive-technologies:
    term: "assistive technology (as used in this document)"
    text: |-
      hardware and/or software that acts as a user agent, or along with a mainstream user agent, to provide functionality to meet the requirements of users with disabilities that go beyond those offered by mainstream user agents
      Note: Functionality provided by assistive technology includes alternative presentations (e.g., as synthesized speech or magnified content), alternative input methods (e.g., voice), additional navigation or orientation mechanisms, and content transformations (e.g., to make tables more accessible).
      Note: Assistive technologies often communicate data and messages with mainstream user agents by using and monitoring APIs.
      Note: The distinction between mainstream user agents and assistive technologies is not absolute. Many mainstream user agents provide some features to assist individuals with disabilities. The basic difference is that mainstream user agents target broad and diverse audiences that usually include people with and without disabilities. Assistive technologies target narrowly defined populations of users with specific disabilities. The assistance provided by an assistive technology is more specific and appropriate to the needs of its target users. The mainstream user agent may provide important functionality to assistive technologies like retrieving web content from program objects or parsing markup into identifiable bundles.
  dfn-audio:
    term: "audio"
    text: |-
      the technology of sound reproduction
      Note: Audio can be created synthetically (including speech synthesis), recorded from real world sounds, or both.
  dfn-audio-descriptions:
    term: "audio description"
    text: |-
      narration added to the soundtrack to describe important visual details that cannot be understood from the main soundtrack alone
      Note: Audio description of video provides information about actions, characters, scene changes, on-screen text, and other visual content.
      Note: In standard audio description, narration is added during existing pauses in dialogue. (See also extended audio description.)
      Note: Where all of the video information is already provided in existing audio, no additional audio description is necessary.
      Note: Also called "video description" and "descriptive narration."
  dfn-audio-only:
    term: "audio-only"
    text: |-
      a time-based presentation that contains only audio (no video and no interaction)
  dfn-blinking:
    term: "blinking"
    text: |-
      switch back and forth between two visual states in a way that is meant to draw attention
      Note: See also flash. It is possible for something to be large enough and blink brightly enough at the right frequency to be also classified as a flash.
  dfn-blocks-of-text:
    term: "blocks of text"
    text: |-
      more than one sentence of text
  dfn-bounding-boxes:
    term: "minimum bounding box"
    text: |-
      the smallest enclosing rectangle aligned to the horizontal axis within which all the points of a shape lie. For components which wrap onto multiple lines as part of a sentence or block of text (such as hypertext links), the bounding box is based on how the component would appear on a single line.
  dfn-captcha:
    term: "CAPTCHA"
    text: |-
      initialism for "Completely Automated Public Turing test to tell Computers and Humans Apart"
      Note: CAPTCHA tests often involve asking the user to type in text that is displayed in an obscured image or audio file.
      Note: A Turing test is any system of tests designed to differentiate a human from a computer. It is named after famed computer scientist Alan Turing. The term was coined by researchers at Carnegie Mellon University.
  dfn-captions:
    term: "captions"
    text: |-
      synchronized visual and/or text alternative for both speech and non-speech audio information needed to understand the media content
      Note: Captions are similar to dialogue-only subtitles except captions convey not only the content of spoken dialogue, but also equivalents for non-dialogue audio information needed to understand the program content, including sound effects, music, laughter, speaker identification and location.
      Note: Closed Captions are equivalents that can be turned on and off with some players.
      Note: Open Captions are any captions that cannot be turned off. For example, if the captions are visual equivalent images of text embedded in video.
      Note: Captions should not obscure or obstruct relevant information in the video.
      Note: In some countries, captions are called subtitles.
      Note: Audio descriptions can be, but do not need to be, captioned since they are descriptions of information that is already presented visually.
  dfn-change-of-context:
    term: "changes of context"
    text: |-
      major changes that, if made without user awareness, can disorient users who are not able to view the entire page simultaneously
      Changes in context include changes of:
      - user agent;
      - viewport;
      - focus;
      - content that changes the meaning of the web page
      Note: A change of content is not always a change of context. Changes in content, such as an expanding outline, dynamic menu, or a tab control do not necessarily change the context, unless they also change one of the above (e.g., focus).
  dfn-cognitive-function-test:
    term: "cognitive function test"
    text: |-
      A task that requires the user to remember, manipulate, or transcribe information. Examples include, but are not limited to:
      - memorization, such as remembering a username, password, set of characters, images, or patterns. The common identifiers name, e-mail, and phone number are not considered cognitive function tests as they are personal to the user and consistent across websites;
      - transcription, such as typing in characters;
      - use of correct spelling;
      - performance of calculations;
      - solving of puzzles.
  dfn-content:
    term: "content (web content)"
    text: |-
      information and sensory experience to be communicated to the user by means of a user agent, including code or markup that defines the content's structure, presentation, and interactions
  dfn-context-sensitive-help:
    term: "context-sensitive help"
    text: |-
      help text that provides information related to the function currently being performed
      Note: Clear labels can act as context-sensitive help.
  dfn-contrast-ratio:
    term: "contrast ratio"
    text: |-
      (L1 + 0.05) / (L2 + 0.05), where
      - L1 is the relative luminance of the lighter of the colors, and
      - L2 is the relative luminance of the darker of the colors.
      Note: Contrast ratios can range from 1 to 21 (commonly written 1:1 to 21:1).
      Note: Because authors do not have control over user settings as to how text is rendered (for example font smoothing or anti-aliasing), the contrast ratio for text can be evaluated with anti-aliasing turned off.
      Note: For the purpose of Success Criteria 1.4.3 and 1.4.6, contrast is measured with respect to the specified background over which the text is rendered in normal usage. If no background color is specified, then white is assumed.
      Note: Background color is the specified color of content over which the text is to be rendered in normal usage. It is a failure if no background color is specified when the text color is specified, because the user's default background color is unknown and cannot be evaluated for sufficient contrast. For the same reason, it is a failure if no text color is specified when a background color is specified.
      Note: When there is a border around the letter, the border can add contrast and would be used in calculating the contrast between the letter and its background. A narrow border around the letter would be used as the letter. A wide border around the letter that fills in the inner details of the letters acts as a halo and would be considered background.
      Note: WCAG conformance should be evaluated for color pairs specified in the content that an author would expect to appear adjacent in typical presentation. Authors need not consider unusual presentations, such as color changes made by the user agent, except where caused by authors' code.
  dfn-correct-reading-sequence:
    term: "correct reading sequence"
    text: |-
      any sequence where words and paragraphs are presented in an order that does not change the meaning of the content
  dfn-css-pixels:
    term: "CSS pixel"
    text: |-
      visual angle of about 0.0213 degrees
      A CSS pixel is the canonical unit of measure for all lengths and measurements in CSS. This unit is density-independent, and distinct from actual hardware pixels present in a display. User agents and operating systems should ensure that a CSS pixel is set as closely as possible to the CSS Values and Units Module Level 3 reference pixel [css3-values], which takes into account the physical dimensions of the display and the assumed viewing distance (factors that cannot be determined by content authors).
  dfn-down-event:
    term: "down-event"
    text: |-
      platform event that occurs when the trigger stimulus of a pointer is depressed
      The down-event may have different names on different platforms, such as "touchstart" or "mousedown".
  dfn-dragging-movements:
    term: "dragging movement"
    text: |-
      an operation where the pointer engages with an element on the down-event and the element (or a representation of its position) follows the pointer until an up-event
      Note: Examples of draggable elements include list items, text elements, and images.
  dfn-emergency:
    term: "emergency"
    text: |-
      a sudden, unexpected situation or occurrence that requires immediate action to preserve health, safety, or property
  dfn-essential:
    term: "essential"
    text: |-
      if removed, would fundamentally change the information or functionality of the content, and information and functionality cannot be achieved in another way that would conform
  dfn-extended-audio-description:
    term: "extended audio description"
    text: |-
      audio description that is added to an audiovisual presentation by pausing the video so that there is time to add additional description
      Note: This technique is only used when the sense of the video would be lost without the additional audio description and the pauses between dialogue/narration are too short.
  dfn-flashes:
    term: "flash"
    text: |-
      a pair of opposing changes in relative luminance that can cause seizures in some people if it is large enough and in the right frequency range
      Note: See general flash and red flash thresholds for information about types of flash that are not allowed.
      Note: See also blinking.
  dfn-focus-indicator:
    term: "focus indicator"
    text: |-
      pixels that are changed to visually indicate when a user interface component is in a focused state
  dfn-functionality:
    term: "functionality"
    text: |-
      processes and outcomes achievable through user action
  dfn-general-flash-and-red-flash-thresholds:
    term: "general flash and red flash thresholds"
    text: |-
      a flash or rapidly changing image sequence is below the threshold (i.e., content passes) if any of the following are true:
      - there are no more than three general flashes and / or no more than three red flashes within any one-second period; or
      - the combined area of flashes occurring concurrently occupies no more than a total of .006 steradians within any 10 degree visual field on the screen (25% of any 10 degree visual field on the screen) at typical viewing distance
      where:
      - A general flash is defined as a pair of opposing changes in relative luminance of 10% or more of the maximum relative luminance (1.0) where the relative luminance of the darker image is below 0.80; and where "a pair of opposing changes" is an increase followed by a decrease, or a decrease followed by an increase, and
      - A red flash is defined as any pair of opposing transitions involving a saturated red
      Exception: Flashing that is a fine, balanced, pattern such as white noise or an alternating checkerboard pattern with "squares" smaller than 0.1 degree (of visual field at typical viewing distance) on a side does not violate the thresholds.
      Note: For general software or web content, using a 341 x 256 pixel rectangle anywhere on the displayed screen area when the content is viewed at 1024 x 768 pixels will provide a good estimate of a 10 degree visual field for standard screen sizes and viewing distances (e.g., 15-17 inch screen at 22-26 inches). This resolution of 75 - 85 ppi is known to be lower, and thus more conservative than the nominal CSS pixel resolution of 96 ppi in CSS specifications. Higher resolutions displays showing the same rendering of the content yield smaller and safer images so it is lower resolutions that are used to define the thresholds.
      Note: A transition is the change in relative luminance (or relative luminance/color for red flashing) between adjacent peaks and valleys in a plot of relative luminance (or relative luminance/color for red flashing) measurement against time. A flash consists of two opposing transitions.
      Note: The new working definition in the field for "pair of opposing transitions involving a saturated red" (from WCAG 2.2) is a pair of opposing transitions where, one transition is either to or from a state with a value R/(R + G + B) that is greater than or equal to 0.8, and the difference between states is more than 0.2 (unitless) in the CIE 1976 UCS chromaticity diagram. [ISO_9241-391]
      Note: Tools are available that will carry out analysis from video screen capture. However, no tool is necessary to evaluate for this condition if flashing is less than or equal to 3 flashes in any one second. Content automatically passes (see #1 and #2 above).
  dfn-human-language-s:
    term: "human language"
    text: |-
      language that is spoken, written or signed (through visual or tactile means) to communicate with humans
      Note: See also sign language.
  dfn-idioms:
    term: "idiom"
    text: |-
      phrase whose meaning cannot be deduced from the meaning of the individual words and the specific words cannot be changed without losing the meaning
      Note: Idioms cannot be translated directly, word for word, without losing their (cultural or language-dependent) meaning.
  dfn-images-of-text:
    term: "image of text"
    text: |-
      text that has been rendered in a non-text form (e.g., an image) in order to achieve a particular visual effect
      Note: This does not include text that is part of a picture that contains significant other visual content.
  dfn-input-error:
    term: "input error"
    text: |-
      information provided by the user that is not accepted
      Note: This includes: Information that is required by the web page but omitted by the user Information that is provided by the user but that falls outside the required data format or values
  dfn-jargon:
    term: "jargon"
    text: |-
      words used in a particular way by people in a particular field
  dfn-keyboard-interface:
    term: "keyboard interface"
    text: |-
      interface used by software to obtain keystroke input
      Note: A keyboard interface allows users to provide keystroke input to programs even if the native technology does not contain a keyboard. ExampleA touchscreen PDA has a keyboard interface built into its operating system as well as a connector for external keyboards. Applications on the PDA can use the interface to obtain keyboard input either from an external keyboard or from other applications that provide simulated keyboard output, such as handwriting interpreters or speech-to-text applications with "keyboard emulation" functionality.
      Note: Operation of the application (or parts of the application) through a keyboard-operated mouse emulator, such as MouseKeys, does not qualify as operation through a keyboard interface because operation of the program is through its pointing device interface, not through its keyboard interface.
  dfn-keyboard-shortcuts:
    term: "keyboard shortcut"
    text: |-
      alternative means of triggering an action by the pressing of one or more keys
  dfn-labels:
    term: "label"
    text: |-
      text or other component with a text alternative that is presented to a user to identify a component within web content
      Note: A label is presented to all users whereas the name may be hidden and only exposed by assistive technology. In many (but not all) cases the name and the label are the same.
      Note: The term label is not limited to the label element in HTML.
  dfn-large-scale:
    term: "large scale (text)"
    text: |-
      with at least 18 point or 14 point bold or font size that would yield equivalent size for Chinese, Japanese and Korean (CJK) fonts
      Note: Fonts with extraordinarily thin strokes or unusual features and characteristics that reduce the familiarity of their letter forms are harder to read, especially at lower contrast levels.
      Note: Font size is the size when the content is delivered. It does not include resizing that may be done by a user.
      Note: The actual size of the character that a user sees is dependent both on the author-defined size and the user's display or user agent settings. For many mainstream body text fonts, 14 and 18 point is roughly equivalent to 1.2 and 1.5 em or to 120% or 150% of the default size for body text (assuming that the body font is 100%), but authors would need to check this for the particular fonts in use. When fonts are defined in relative units, the actual point size is calculated by the user agent for display. The point size should be obtained from the user agent, or calculated based on font metrics as the user agent does, when evaluating this success criterion. Users who have low vision would be responsible for choosing appropriate settings.
      Note: When using text without specifying the font size, the smallest font size used on major browsers for unspecified text would be a reasonable size to assume for the font. If a level 1 heading is rendered in 14pt bold or higher on major browsers, then it would be reasonable to assume it is large text. Relative scaling can be calculated from the default sizes in a similar fashion.
      Note: The 18 and 14 point sizes for roman texts are taken from the minimum size for large print (14pt) and the larger standard font size (18pt). For other fonts such as CJK languages, the "equivalent" sizes would be the minimum large print size used for those languages and the next larger standard large print size.
  dfn-legal-commitments:
    term: "legal commitments"
    text: |-
      transactions where the person incurs a legally binding obligation or benefit
  dfn-live:
    term: "live"
    text: |-
      information captured from a real-world event and transmitted to the receiver with no more than a broadcast delay
      Note: A broadcast delay is a short (usually automated) delay, for example used in order to give the broadcaster time to cue or censor the audio (or video) feed, but not sufficient to allow significant editing.
      Note: If information is completely computer generated, it is not live.
  dfn-lower-secondary-education-level:
    term: "lower secondary education level"
    text: |-
      the two or three year period of education that begins after completion of six years of school and ends nine years after the beginning of primary education
      Note: This definition is based on the International Standard Classification of Education [UNESCO].
  dfn-mechanism:
    term: "mechanism"
    text: |-
      process or technique for achieving a result
      Note: The mechanism may be explicitly provided in the content, or may be relied upon to be provided by either the platform or by user agents, including assistive technologies.
      Note: The mechanism needs to meet all success criteria for the conformance level claimed.
  dfn-media-alternative-for-text:
    term: "media alternative for text"
    text: |-
      media that presents no more information than is already presented in text (directly or via text alternatives)
      Note: A media alternative for text is provided for those who benefit from alternate representations of text. Media alternatives for text may be audio-only, video-only (including sign-language video), or audio-video.
  dfn-motion-animation:
    term: "motion animation"
    text: |-
      addition of steps between conditions to create the illusion of movement or to give a sense of a smooth transition
  dfn-name:
    term: "name"
    text: |-
      text by which software can identify a component within web content to the user
      Note: The name may be hidden and only exposed by assistive technology, whereas a label is presented to all users. In many (but not all) cases, the label and the name are the same.
      Note: This is unrelated to the name attribute in HTML.
  dfn-navigated-sequentially:
    term: "navigated sequentially"
    text: |-
      navigated in the order defined for advancing focus (from one element to the next) using a keyboard interface
  dfn-non-text-content:
    term: "non-text content"
    text: |-
      any content that is not a sequence of characters that can be programmatically determined or where the sequence is not expressing something in human language
      Note: This includes ASCII art (which is a pattern of characters), emoticons, leetspeak (which uses character substitution), and images representing text
  dfn-on-a-full-screen-window:
    term: "on a full-screen window"
    text: |-
      on the most common sized desktop/laptop display with the viewport maximized
      Note: Since people generally keep their computers for several years, it is best not to rely on the latest desktop/laptop display resolutions but to consider the common desktop/laptop display resolutions over the course of several years when making this evaluation.
  dfn-pause:
    term: "paused"
    text: |-
      stopped by user request and not resumed until requested by user
  dfn-perimeter:
    term: "perimeter"
    text: |-
      continuous line forming the boundary of a shape not including shared pixels, or the minimum bounding box, whichever is shortest.
  dfn-pointer-inputs:
    term: "pointer input"
    text: |-
      input from a device that can target a specific coordinate (or set of coordinates) on a screen, such as a mouse, pen, or touch contact
      Note: See the Pointer Events definition for "pointer" [pointerevents].
  dfn-prerecorded:
    term: "prerecorded"
    text: |-
      information that is not live
  dfn-presentation:
    term: "presentation"
    text: |-
      rendering of the content in a form to be perceived by users
  dfn-processes:
    term: "process"
    text: |-
      series of user actions where each action is required in order to complete an activity
  dfn-programmatically-determinable:
    term: "programmatically determined (programmatically determinable)"
    text: |-
      determined by software from author-supplied data provided in a way that different user agents, including assistive technologies, can extract and present this information to users in different modalities
  dfn-programmatically-determined-link-context:
    term: "programmatically determined link context"
    text: |-
      additional information that can be programmatically determined from relationships with a link, combined with the link text, and presented to users in different modalities
      Note: Since screen readers interpret punctuation, they can also provide the context from the current sentence, when the focus is on a link in that sentence.
  dfn-programmatically-set:
    term: "programmatically set"
    text: |-
      set by software using methods that are supported by user agents, including assistive technologies
  dfn-pure-decoration:
    term: "pure decoration"
    text: |-
      serving only an aesthetic purpose, providing no information, and having no functionality
      Note: Text is only purely decorative if the words can be rearranged or substituted without changing their purpose.
  dfn-purpose-of-each-link:
    term: "link purpose"
    text: |-
      nature of the result obtained by activating a hyperlink
  dfn-real-time-events:
    term: "real-time event"
    text: |-
      event that a) occurs at the same time as the viewing and b) is not completely generated by the content
  dfn-regions:
    term: "region"
    text: |-
      perceivable, programmatically determined section of content
      Note: In HTML, any area designated with a landmark role would be a region.
  dfn-relationships:
    term: "relationships"
    text: |-
      meaningful associations between distinct pieces of content
  dfn-role:
    term: "role"
    text: |-
      text or number by which software can identify the function of a component within Web content
  dfn-same-functionality:
    term: "same functionality"
    text: |-
      same result when used
  dfn-same-relative-order:
    term: "same relative order"
    text: |-
      same position relative to other items
      Note: Items are considered to be in the same relative order even if other items are inserted or removed from the original order. For example, expanding navigation menus may insert an additional level of detail or a secondary navigation section may be inserted into the reading order.
  dfn-section:
    term: "section"
    text: |-
      a self-contained portion of written content that deals with one or more related topics or thoughts
      Note: A section may consist of one or more paragraphs and include graphics, tables, lists and sub-sections.
  dfn-set-of-web-pages:
    term: "set of web pages"
    text: |-
      collection of web pages that share a common purpose and that are created by the same author, group or organization
      Note: Different language versions would be considered different sets of web pages.
  dfn-sign-language-interpretation:
    term: "sign language interpretation"
    text: |-
      translation of one language, generally a spoken language, into a sign language
      Note: True sign languages are independent languages that are unrelated to the spoken language(s) of the same country or region.
  dfn-single-pointer:
    term: "single pointer"
    text: |-
      an input modality that only targets a single point on the page/screen at a time – such as a mouse, single finger on a touch screen, or stylus.
      Note: Single pointer interactions include clicks, double clicks, taps, dragging motions, and single-finger swipe gestures. In contrast, multipoint interactions involve the use of two or more pointers at the same time, such as two-finger interactions on a touchscreen, or the simultaneous use of a mouse and stylus.
  dfn-specific-sensory-experience:
    term: "specific sensory experience"
    text: |-
      a sensory experience that is not purely decorative and does not primarily convey important information or perform a function
  dfn-states:
    term: "state"
    text: |-
      dynamic property expressing characteristics of a user interface component that may change in response to user action or automated processes
      States do not affect the nature of the component, but represent data associated with the component or user interaction possibilities. Examples include focus, hover, select, press, check, visited/unvisited, and expand/collapse.
  dfn-status-messages:
    term: "status message"
    text: |-
      change in content that is not a change of context, and that provides information to the user on the success or results of an action, on the waiting state of an application, on the progress of a process, or on the existence of errors
  dfn-structure:
    term: "structure"
    text: |-
      - The way the parts of a web page are organized in relation to each other; and
      - The way a collection of web pages is organized
  dfn-style-properties:
    term: "style property"
    text: |-
      property whose value determines the presentation (e.g. font, color, size, location, padding, volume, synthesized speech prosody) of content elements as they are rendered (e.g. onscreen, via loudspeaker, via braille display) by user agents
      Style properties can have several origins:
      - User agent default styles: The default style property values applied in the absence of any author or user styles. Some web content technologies specify a default rendering, others do not;
      - Author styles: Style property values that are set by the author as part of the content (e.g. in-line styles, author style sheets);
      - User styles: Style property values that are set by the user (e.g. via user agent interface settings, user style sheets)
  dfn-supplementary-content:
    term: "supplemental content"
    text: |-
      additional content that illustrates or clarifies the primary content
  dfn-synchronized-media:
    term: "synchronized media"
    text: |-
      audio or video synchronized with another format for presenting information and/or with time-based interactive components, unless the media is a media alternative for text that is clearly labeled as such
  dfn-targets:
    term: "target"
    text: |-
      region of the display that will accept a pointer action, such as the interactive area of a user interface component
      Note: If two or more targets are overlapping, the overlapping area should not be included in the measurement of the target size, except when the overlapping targets perform the same action or open the same page.
  dfn-technologies:
    term: "technology (web content)"
    text: |-
      mechanism for encoding instructions to be rendered, played or executed by user agents
      Note: As used in these guidelines "web technology" and the word "technology" (when used alone) both refer to web content technologies.
      Note: Web content technologies may include markup languages, data formats, or programming languages that authors may use alone or in combination to create end-user experiences that range from static web pages to synchronized media presentations to dynamic Web applications.
  dfn-text:
    term: "text"
    text: |-
      sequence of characters that can be programmatically determined, where the sequence is expressing something in human language
  dfn-text-alternative:
    term: "text alternative"
    text: |-
      Text that is programmatically associated with non-text content or referred to from text that is programmatically associated with non-text content. Programmatically associated text is text whose location can be programmatically determined from the non-text content.
      Note: Refer to Understanding Text Alternatives for more information.
  dfn-up-event:
    term: "up-event"
    text: |-
      platform event that occurs when the trigger stimulus of a pointer is released
      The up-event may have different names on different platforms, such as "touchend" or "mouseup".
  dfn-used-in-an-unusual-or-restricted-way:
    term: "used in an unusual or restricted way"
    text: |-
      words used in such a way that requires users to know exactly which definition to apply in order to understand the content correctly
  dfn-user-agents:
    term: "user agent"
    text: |-
      any software that retrieves and presents web content for users
  dfn-user-controllable:
    term: "user-controllable"
    text: |-
      data that is intended to be accessed by users
      Note: This does not refer to such things as Internet logs and search engine monitoring data.
  dfn-user-inactivity:
    term: "user inactivity"
    text: |-
      any continuous period of time where no user actions occur
      The method of tracking will be determined by the website or application.
  dfn-user-interface-components:
    term: "user interface component"
    text: |-
      a part of the content that is perceived by users as a single control for a distinct function
      Note: Multiple user interface components may be implemented as a single programmatic element. "Components" here is not tied to programming techniques, but rather to what the user perceives as separate controls.
      Note: User interface components include form elements and links as well as components generated by scripts.
      Note: What is meant by "component" or "user interface component" here is also sometimes called "user interface element".
  dfn-video:
    term: "video"
    text: |-
      the technology of moving or sequenced pictures or images
      Note: Video can be made up of animated or photographic images, or both.
  dfn-video-only:
    term: "video-only"
    text: |-
      a time-based presentation that contains only video (no audio and no interaction)
  dfn-viewport:
    term: "viewport"
    text: |-
      object in which the user agent presents content
      Note: The user agent presents content through one or more viewports. Viewports include windows, frames, loudspeakers, and virtual magnifying glasses. A viewport may contain another viewport (e.g., nested frames). Interface components created by the user agent such as prompts, menus, and alerts are not viewports.
      Note: This definition is based on User Agent Accessibility Guidelines 1.0 Glossary [UAAG10].
  dfn-visually-customized:
    term: "visually customized"
    text: |-
      the font, size, color, and background can be set
  dfn-web-page-s:
    term: "web page"
    text: |-
      a non-embedded resource obtained from a single URI using HTTP plus any other resources that are used in the rendering or intended to be rendered together with it by a user agent
      Note: Although any "other resources" would be rendered together with the primary resource, they would not necessarily be rendered simultaneously with each other.
      Note: For the purposes of conformance with these guidelines, a resource must be "non-embedded" within the scope of conformance to be considered a web page.
